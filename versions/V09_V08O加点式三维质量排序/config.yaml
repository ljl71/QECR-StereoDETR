base_config: ../../configs/QECR默认配置.yaml

model_name: qecr_v09_v08o_pointwise_3d_quality

# V09不再训练StereoDETR检测器，而是把已经取得49.5345的V08O最佳
# checkpoint作为冻结起点，只训练V06B已经验证过的查询级3D质量头。
dataset:
  matcher_mode: StereoBM
  aug_pd: false
  aug_crop: false
  random_mixup3d: 0.0
  random_flip: 0.0
  random_crop: 0.0
  random_switch: 0.0
  disparity_supervision:
    mode: scalar
    lrc_soft_weight: false

model:
  quality_ranking:
    enabled: true
    freeze_detector: true
    quality_only_when_frozen: true
    # G2已经确定beta=1.5位于稳定平台；V09固定该值，不重新扫描验证集。
    score_power: 1.5
    point_loss_coef: 10.0
    negative_threshold: 0.1
    negative_weight: 0.1
    pairwise_enabled: false

  geometry_alignment:
    enabled: false
    corner_enabled: false
    projection_enabled: false

tester:
  quality_guided_topk: false

optimizer:
  lr: 0.001

lr_scheduler:
  warmup: false
  decay_list: [1000]

trainer:
  max_epoch: 5
  save_frequency: 1
  save_all: false
  pretrain_model: /root/autodl-tmp/QECR-StereoDETR/outputs/第二创新点_V08空间投影对齐/V08O_公平控制组/qecr_v08o_geometry_control/checkpoint_best.pth
  pretrain_strict: false
  # V08O没有质量头，因此只允许quality_head.*缺失；任何其他结构差异都停止。
  pretrain_allowed_missing_prefixes:
    - quality_head.
  pretrain_allow_unexpected: false
  save_path: outputs/最终组合_V09/V09_V08O加点式三维质量排序/
