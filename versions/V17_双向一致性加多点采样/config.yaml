base_config: ../../configs/QECR默认配置.yaml

model_name: qecr_v17_bidirectional_multipoint

model:
  query_depth:
    enabled: true
    cross_layer_refine: true
    num_points: 5
  query_epipolar:
    enabled: true
    bidirectional: true
    use_geometry_gate: false

trainer:
  save_path: outputs/QECR消融实验/V17_双向一致性加多点采样/

