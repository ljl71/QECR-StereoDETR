base_config: ../../configs/QECR默认配置.yaml

model_name: qecr_v16_bidirectional_epipolar

model:
  query_depth:
    enabled: true
    cross_layer_refine: true
    num_points: 1
  query_epipolar:
    enabled: true
    bidirectional: true
    use_geometry_gate: false

trainer:
  save_path: outputs/QECR消融实验/V16_双向极线一致性/

