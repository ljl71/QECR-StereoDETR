base_config: ../V22O_原始Laplace深度控制/config.yaml

model_name: qecr_v22a_axial_iou_depth_loss

# V22A与V22O的模型参数、起点、训练范围、学习率和随机种子完全相同；
# 唯一变量是给原Laplace深度损失增加0.5权重的一维轴向GIoU辅助项。
model:
  axial_depth_iou:
    enabled: true
    loss_coef: 0.5
    min_half_extent: 0.05
    eps: 0.000001
    train_only_depth_classifier: true
    trainable_prefixes:
      - depth_predictor.depth_classifier.

trainer:
  save_path: outputs/第三阶段_V22轴向IoU深度损失/V22A_轴向IoU敏感深度损失/
