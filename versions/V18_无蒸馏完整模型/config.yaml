base_config: ../../configs/QECR默认配置.yaml

model_name: qecr_v18_full_without_distillation

model:
  query_depth:
    enabled: true
    cross_layer_refine: true
    num_points: 5
  query_epipolar:
    enabled: true
    bidirectional: true
    use_geometry_gate: true

trainer:
  save_path: outputs/QECR消融实验/V18_无蒸馏完整模型/

