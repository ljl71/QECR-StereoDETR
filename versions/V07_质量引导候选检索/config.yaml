base_config: ../V06B_点式三维质量排序/config.yaml

model_name: qecr_v07_quality_guided_topk

model:
  quality_ranking:
    # 固定G2确定的稳健平台内部取值，不在G3继续扫描beta。
    score_power: 1.5

tester:
  # 第二创新点候选：Top-K与最终3D质量分数使用同一排序依据。
  quality_guided_topk: true

trainer:
  # V07本阶段只做evaluate_only；复用V06B权重，不重新训练。
  save_path: outputs/质量引导候选检索诊断_G3/V07_质量引导候选检索/
