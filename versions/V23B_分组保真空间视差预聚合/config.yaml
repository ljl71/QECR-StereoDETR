base_config: ../V23O_原始相关公平控制/config.yaml

model_name: qecr_v23b_gpsd

# V23B在s4保留4组×24视差证据，经轻量2D倒残差混合后，仅以残差
# 形式修正原始标量相关体。它不改变候选数、检测头或V09质量排序。
model:
  cost_preaggregation:
    enabled: true
    type: gpsd
    scale: 4
    num_groups: 4
    expansion_ratio: 2
    residual_scale: 1.0
    train_only_cost_aggregation: true
    trainable_prefixes:
      - depth_predictor.cost_agg.
      - depth_predictor.cost_preaggregation_s4.

trainer:
  pretrain_strict: false
  pretrain_allowed_missing_prefixes:
    - depth_predictor.cost_preaggregation_s4.
  pretrain_allow_unexpected: false
  save_path: outputs/V23分组保真预聚合/V23B_分组保真空间视差预聚合/
