base_config: ../../configs/QECR默认配置.yaml

model_name: qecr_v08c_spatial_projection_alignment

# Canonical geometry is used for the first paired screen. All geometric
# augmentation is disabled equally in V08O/A/B/C so the comparison is clean.
dataset:
  matcher_mode: StereoBM
  aug_pd: false
  aug_crop: false
  random_mixup3d: 0.0
  random_flip: 0.0
  random_crop: 0.0
  random_switch: 0.0
  disparity_supervision:
    mode: scalar
    lrc_soft_weight: false

model:
  geometry_alignment:
    enabled: true
    corner_enabled: true
    projection_enabled: true
    corner_loss_coef: 1.0
    projection_loss_coef: 1.0
    projection_boundary_weight: 0.25
    start_epoch: 1
    ramp_epochs: 4

optimizer:
  lr: 0.00002

lr_scheduler:
  warmup: false
  decay_list: [1000]

trainer:
  max_epoch: 5
  save_frequency: 1
  save_all: false
  pretrain_model: /root/autodl-tmp/QECR-StereoDETR/outputs/QECR消融实验/V00_官方基线/qecr_v00_official_baseline/checkpoint_best.pth
  pretrain_strict: true
  save_path: outputs/第二创新点_V08空间投影对齐/V08C_空间投影协同对齐/
