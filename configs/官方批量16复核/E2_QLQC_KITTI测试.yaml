base_config: T2_trainval_QLQC.yaml

model_name: qlqc_global_batch16_kitti_test

# 推理批量不属于训练协议。使用已经验证稳定的12，避免无意义地占用显存。
dataset:
  batch_size: 12

trainer:
  gpu_ids: "0"
  amp_enabled: false
  resume_if_exists: false
  save_final_checkpoint: false
  save_path: outputs/KITTI_trainval官方批量16复核/官网测试/QLQC/
