base_config: V09T1_trainval强控制.yaml

# 固定协议阶段2：从同一个强控制权重出发，冻结检测器，只训练QLQC质量头。
# 3轮和score_power=1.5均由既有Chen验证实验预先确定，禁止根据test调节。
model_name: qecr_v09t2_trainval_qlqc

model:
  quality_ranking:
    enabled: true
    loss_enabled: true
    freeze_detector: true
    quality_only_when_frozen: true
    score_power: 1.5
    point_loss_coef: 10.0
    negative_threshold: 0.1
    negative_weight: 0.1
    pairwise_enabled: false

tester:
  quality_guided_topk: false

optimizer:
  lr: 0.001

trainer:
  max_epoch: 3
  pretrain_model: /root/autodl-tmp/QECR-StereoDETR/outputs/KITTI_trainval官网复核/V09T1_trainval强控制/qecr_v09t1_trainval_strong_control/checkpoint_final.pth
  pretrain_strict: false
  pretrain_allowed_missing_prefixes:
    - quality_head.
  pretrain_allow_unexpected: false
  save_path: outputs/KITTI_trainval官网复核/V09T2_trainval_QLQC/
