base_config: 001-final_exp1.yaml

# AutoDL 常见目录布局。若实例中的 KITTI 路径不同，只改下面四项。
dataset:
  root_dir: /root/autodl-tmp/datasets/KITTI/object/training
  train_txt: /root/autodl-tmp/datasets/KITTI/object/training/ImageSets/train.txt
  root_dir_eval: /root/autodl-tmp/datasets/KITTI/object/training
  eval_txt: /root/autodl-tmp/datasets/KITTI/object/training/ImageSets/val.txt
  workers: 8
  depth_scale: normal
  stereo_shift_aug: 0
  # 与已经完成的 RTX 4090 本地基线保持一致；Batch 16 在当前
  # PyTorch 2.0.1 FP32 环境中会 OOM。
  batch_size: 12

trainer:
  gpu_ids: "0"
  save_path: outputs/QECR消融实验/

